[project]
name = "kabao-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["typer", "rich", "kabao-core", "kabao-engine", "kabao-connectors"]

[project.scripts]
kabao = "cli.main:app"

[tool.uv.sources]
kabao-core = { workspace = true }
kabao-engine = { workspace = true }
kabao-connectors = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]
