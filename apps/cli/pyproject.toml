[project]
name = "butler-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["typer", "rich", "butler-core", "butler-engine", "butler-connectors"]

[project.scripts]
butler = "cli.main:app"

[tool.uv.sources]
butler-core = { workspace = true }
butler-engine = { workspace = true }
butler-connectors = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]
