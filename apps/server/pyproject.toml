[project]
name = "kabao-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "pydantic-settings",
    "httpx>=0.27",  # TestClient 依赖（契约冒烟测试）
    "kabao-core",
    "kabao-engine",
    "kabao-connectors",  # 连接器注册表（ADR-003：端组装层装载）
]

[tool.uv.sources]
kabao-core = { workspace = true }
kabao-engine = { workspace = true }
kabao-connectors = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]
