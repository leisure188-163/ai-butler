[project]
name = "butler-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp", "httpx"]

[project.scripts]
butler-mcp = "butler_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/butler_mcp"]
