[project]
name = "butler-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "butler-core",
    "butler-engine",
    "butler-connectors",
    "butler-server",
    "butler-cli",
    "butler-mcp",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = [
    "packages/core/tests",
    "packages/engine/tests",
    "packages/connectors/tests",
    "apps/server/tests",
    "apps/mcp/tests",
]

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/engine",
    "packages/connectors",
    "apps/server",
    "apps/cli",
    "apps/mcp",
]

[tool.uv.sources]
butler-core = { workspace = true }
butler-engine = { workspace = true }
butler-connectors = { workspace = true }
butler-server = { workspace = true }
butler-cli = { workspace = true }
butler-mcp = { workspace = true }
