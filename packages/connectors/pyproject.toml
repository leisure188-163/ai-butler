[project]
name = "kabao-connectors"
version = "0.1.0"
description = "Kabao 连接器家族（A2-02）：manifest 声明 + 声明式引擎 + 各产品适配器"
requires-python = ">=3.11"
dependencies = [
    "kabao-core",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "cryptography>=42",
    "websocket-client>=1.8",
]

[tool.uv.sources]
kabao-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kabao_connectors"]
