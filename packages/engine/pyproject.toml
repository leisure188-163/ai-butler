[project]
name = "kabao-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["kabao-core"]

[tool.uv.sources]
kabao-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kabao_engine"]
