[project]
name = "butler-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["butler-core"]

[tool.uv.sources]
butler-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/butler_engine"]
